<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgotten Games</title>

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <style>
        :root {
            --bg: #27262B;
            --panel: #1f1e23;
            --panel-dark: #19181d;
            --accent: #5A99EC;
            --text: #e6e6eb;
            --muted: #a0a0ad;
        }

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            background: var(--bg);
            color: var(--text);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            width: 100%;
            max-width: 1000px;
            padding: 32px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 0;
            text-align: center;
        }

        .player-wrapper {
            background: var(--panel);
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }

        #swfplayer {
            width: 800px;
            height: 600px;
            background: black;
        }

        /* DirPlayer embeds fill the same box as Ruffle */
        #swfplayer embed,
        #swfplayer object {
            width: 100%;
            height: 100%;
        }

        .status {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            padding: 24px;
            text-align: center;
            line-height: 1.5;
        }

        /* Control bar */
        .control-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            background: var(--panel-dark);
            border-top: 1px solid #2a2930;
        }

        .control-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease, transform 0.1s ease;
        }

        .control-btn i {
            font-size: 1.25rem;
        }

        .control-btn:hover {
            background: rgba(90, 153, 236, 0.15);
            color: var(--accent);
            transform: translateY(-1px);
        }

        .control-btn:active {
            transform: translateY(0);
            opacity: 0.9;
        }

        @media (max-width: 900px) {
            #swfplayer {
                width: 100%;
                height: 56vw;
                max-height: 70vh;
            }

            h1 {
                font-size: 2.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Forgotten Games</h1>

        <div class="player-wrapper">
            <div id="swfplayer"></div>

            <div class="control-bar">
                <div class="control-btn" id="restartBtn" title="Restart game">
                    <i class="bi bi-arrow-clockwise"></i>
                </div>

                <div class="control-btn" id="fullscreenBtn" title="Fullscreen">
                    <i class="bi bi-fullscreen"></i>
                </div>
            </div>
        </div>
    </div>

    <script>
        const RUFFLE_URL = "https://unpkg.com/@ruffle-rs/ruffle";
        const DIRPLAYER_URL = "https://dirplayer-rs.s3.us-west-2.amazonaws.com/dirplayer-polyfill-latest.js";

        const container = document.getElementById("swfplayer");
        let player = null;   // Ruffle player element, if a Flash game is loaded
        let kind = null;     // "flash" or "director"
        let gameUrl = null;

        function showStatus(text) {
            container.innerHTML = "";
            const p = document.createElement("div");
            p.className = "status";
            p.textContent = text;
            container.appendChild(p);
        }

        function loadScript(src, attrs = {}) {
            return new Promise((resolve, reject) => {
                const s = document.createElement("script");
                s.src = src;
                for (const [k, v] of Object.entries(attrs)) s.setAttribute(k, v);
                s.onload = resolve;
                s.onerror = () => reject(new Error("Could not load " + src));
                document.head.appendChild(s);
            });
        }

        function detectKind(url) {
            const path = url.split("#")[0].split("?")[0].toLowerCase();
            return path.endsWith(".dcr") ? "director" : "flash";
        }

        async function startFlash() {
            await loadScript(RUFFLE_URL);
            const ruffle = window.RufflePlayer.newest();
            player = ruffle.createPlayer();
            player.style.width = "100%";
            player.style.height = "100%";
            container.innerHTML = "";
            container.appendChild(player);
            player.load(gameUrl);
        }

        async function startDirector() {
            // data-manual-init stops the polyfill from scanning the page on its own
            await loadScript(DIRPLAYER_URL, { "data-manual-init": "" });
            const el = document.createElement("embed");
            el.setAttribute("src", gameUrl);
            el.setAttribute("type", "application/x-director");
            // Pixel sizes: a "100%" attribute may be read as 100px by the polyfill
            el.setAttribute("width", String(container.clientWidth));
            el.setAttribute("height", String(container.clientHeight));
            container.innerHTML = "";
            container.appendChild(el);
            console.log("[Forgotten Games] DirPlayer embed:", gameUrl, el.width, "x", el.height);
            window.DirPlayer.init();
        }

        window.addEventListener("DOMContentLoaded", async () => {
            const params = new URLSearchParams(window.location.search);
            // "swf" keeps working for existing links; it also accepts .dcr files
            gameUrl = params.get("swf") || params.get("dcr");

            if (!gameUrl) {
                showStatus("No game selected. Add ?swf=game.swf or ?swf=game.dcr to the address.");
                return;
            }

            kind = detectKind(gameUrl);

            try {
                if (kind === "director") await startDirector();
                else await startFlash();
            } catch (err) {
                console.error(err);
                showStatus("The player could not be loaded. Check your connection and reload the page.");
            }
        });

        document.getElementById("restartBtn").addEventListener("click", () => {
            if (!gameUrl) return;
            if (kind === "flash" && player) player.load(gameUrl);
            else if (kind === "director") window.location.reload(); // simplest clean restart for DirPlayer
        });

        document.getElementById("fullscreenBtn").addEventListener("click", () => {
            const target = (kind === "flash" && player) ? player : container;
            if (target.requestFullscreen) target.requestFullscreen();
        });
    </script>
</body>
</html>
